<style>

  const c=this.ctx;if(!c||this.muted)return {set(){},stop(){}};const out=c.createGain();out.gain.value=0;out.connect(this.sfx);const nodes=[];

/* ---------------- STATE ---------------- */
let s;
function makeNPCs(){const cols=['#e06a5a','#5a8ae0','#e0b04a','#6ac07a','#b07ae0','#4ab0b0','#e08ac0','#8a8a8a'],out=[];
 for(let i=0;i<9;i++){const home=pick(CUSTOMERS);let p;do{p={x:rand(1,29),y:rand(1,29)}}while(blocked(p.x,p.y,.3));
  out.push({x:p.x,y:p.y,vx:0,vy:0,tx:p.x,ty:p.y,face:1,back:false,walk:0,moving:false,wait:rand(0,3),home:home.id,name:pick(NAMES[home.kind]),shirt:cols[i%cols.length],hair:pick(['#3a2418','#1e1e24','#8a5a2a','#d8b060']),skin:pick(['#f6d2b0','#e8b890','#c99470']),promo:0,subbed:false,stuck:0,say:null})}return out}
function newGame(){return {status:'ready',modal:null,day:0,min:DAY_START,hours:{open:9,close:18},nextHours:null,energy:100,gold:100,pop:20,
 p:{x:HOME.doorPt.x,y:HOME.doorPt.y+.2,vx:0,vy:0,face:1,back:false,walk:0,moving:false,sit:0},orders:[],seq:0,nextOrder:4,reviews:[],reviewT:6,subs:[],quests:makeQuests(),
 rivals:[{name:'구름다방',id:'cloud',pop:110,g:3.4},{name:'모카하우스',id:'mocha',pop:85,g:3},{name:'라떼공방',id:'lattelab',pop:60,g:2.6},{name:'새벽로스터리',id:'dawn',pop:40,g:2.2}],
 npcs:null,parts:[],floats:[],shake:0,today:{deliv:0,gold:0,pop:0,late:0,promo:0},mood:[],opened:false,closed:false,tiredWarned:false,passOut:false,benchCd:{},bumpCd:0,stepT:0,
 introPage:0,introChars:0,t:0,bestRank:null,hint:{},promoCd:8}}
function makeQuests(){const pool=[['deliver',ri(3,5),'배달 {n}건 완료하기'],['ice',ri(2,3),'아이스 메뉴 {n}잔 배달'],['hot',ri(2,3),'핫 메뉴 {n}잔 배달'],['perfect',ri(2,3),'완벽한 제조 {n}회'],['ontime',ri(2,4),'늦지 않게 배달 {n}건'],['promo',1,'정기 배달 판촉 1회 성공'],['bench',1,'벤치에서 1번 쉬기'],['tea',2,'티 메뉴 {n}잔 배달']];
 const q=[];while(q.length<3){const c=pick(pool);if(!q.some(x=>x.k===c[0]))q.push({k:c[0],n:c[1],t:c[2].replace('{n}',c[1]),have:0,done:false,gold:ri(20,40),pop:ri(1,3)})}return q}
const isOpen=()=>s.opened&&!s.closed;
const fmt=m=>{m=Math.floor(m);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const dateTxt=()=>{const md=s.day%28;return `${Math.floor(s.day/28)+1}월 ${Math.floor(md/7)+1}주차 · ${md+1}일 (${WEEK[md%7]})`};
function ranking(){return [...s.rivals.map(r=>({name:r.name,pop:r.pop,me:false})),{name:'달빛 커피',pop:s.pop,me:true}].sort((a,b)=>b.pop-a.pop)}
const myRank=()=>ranking().findIndex(r=>r.me)+1;

/* ---------------- PHYSICS ---------------- */
function blocked(x,y,r){if(x<r||y<r||x>MAP-r||y>MAP-r)return true;
 for(const b of SOLIDS)if(x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.d)return true;
 for(const t of TREES)if(Math.hypot(t.x-x,t.y-y)<r+t.r)return true;return false}
function moveBody(e,dt,ix,iy,max,r){/* screen-relative input -> isometric world axes, smoothed acceleration, axis-separated collision */
 let dx=ix+iy,dy=-ix+iy;const l=Math.hypot(dx,dy);if(l>0){dx/=l;dy/=l}
 const k=Math.min(1,dt*(l?11:14));e.vx+=(dx*max-e.vx)*k;e.vy+=(dy*max-e.vy)*k;
 let hit=false;const nx=e.x+e.vx*dt;if(!blocked(nx,e.y,r))e.x=nx;else{hit=Math.abs(e.vx)>1.4;e.vx=0}
 const ny=e.y+e.vy*dt;if(!blocked(e.x,ny,r))e.y=ny;else{hit=hit||Math.abs(e.vy)>1.4;e.vy=0}
 const sp=Math.hypot(e.vx,e.vy);e.moving=sp>.25;if(e.moving){const sx=e.vx-e.vy,sy=e.vx+e.vy;if(Math.abs(sx)>.2)e.face=sx>0?1:-1;e.back=sy<-.2;e.walk+=dt*sp*.9}
 return hit}

/* ---------------- FX ---------------- */
function emit(kind,wx,wy,z,n,o={}){const [sx,sy]=iso(wx,wy);for(let i=0;i<n;i++){const a=rand(0,TAU),sp=rand(o.min??10,o.max??40);
 s.parts.push({kind,x:sx+rand(-(o.spread??3),o.spread??3),y:sy,z:z+rand(0,o.zr??2),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*.5,vz:rand(o.up??20,o.up2??60),g:o.g??90,life:0,max:rand(o.life??.6,o.life2??1.1),c:o.c?(Array.isArray(o.c)?pick(o.c):o.c):'#fff',size:o.size??1})}}
function float(wx,wy,text,c='#fff',z=34){s.floats.push({x:wx,y:wy,z,text,c,life:0})}
function toast(text,kind='info'){const box=$('#toasts');const d=document.createElement('div');d.className='toast pix '+kind;d.textContent=text;box.appendChild(d);while(box.children.length>3)box.firstChild.remove();setTimeout(()=>d.classList.add('out'),2600);setTimeout(()=>d.remove(),3100);A.play('toast')}
function bumpEl(id){const e=$(id);e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}
function flashQuest(){const q=$('#questBtn');q.classList.remove('flash');void q.offsetWidth;q.classList.add('flash')}
function addGold(n){s.gold+=n;s.today.gold+=n;bumpEl('#gold')}
function addPop(n){s.pop=Math.max(0,s.pop+n);s.today.pop+=n;bumpEl('#pop');s.mood.push(Math.sign(n));if(s.mood.length>8)s.mood.shift()}
function setEnergy(v){const was=s.energy;s.energy=clamp(v,0,100);if(was>20&&s.energy<=20&&!s.tiredWarned){s.tiredWarned=true;A.play('warn');toast('피곤해요… 이동 속도가 느려져요. 벤치나 집에서 쉬세요!','bad');emit('drop',s.p.x,s.p.y,22,6,{c:'#7ac8ff',up:20,up2:40})}if(s.energy>20)s.tiredWarned=false;if(s.energy>was+.5){const e=$('#enBar');e.classList.remove('spark');void e.offsetWidth;e.classList.add('spark')}}
function quest(k,n=1){for(const q of s.quests){if(q.k!==k||q.done)continue;q.have=Math.min(q.n,q.have+n);if(q.have>=q.n){q.done=true;addGold(q.gold);addPop(q.pop);A.play('quest');toast(`데일리 퀘스트 완료! ${q.t} (+${q.gold}G, 인기 +${q.pop})`,'good');emit('confetti',s.p.x,s.p.y,30,26,{c:['#ffd24a','#ff7a7a','#7ad0ff','#9be07a','#d79aff'],up:50,up2:110,g:120,life:1,life2:1.6})}}}

/* ---------------- ORDERS ---------------- */
const tempName=o=>(o.temp==='hot'?'HOT ':'ICE ')+MENU[o.m].name;
function spawnOrder(sub){const site=sub?BY[sub.site]:pick(CUSTOMERS),m=pick(MENU),temp=Math.random()<.5?'hot':'ice';
 const o={id:++s.seq,m:m.id,temp,who:sub?sub.name:pick(NAMES[site.kind]),site:site.id,price:m.price+(temp==='ice'?4:0),created:s.min,status:sub?'accepted':'new',sub:!!sub,due:sub?s.min+180:0,quality:null};
 s.orders.push(o);A.play('order');flashQuest();toast(sub?`정기 배달 주문: ${o.who} · ${tempName(o)} (자동 승인)`:`🔔 새 주문! ${o.who} (${site.name}) · ${tempName(o)}`,'info');
 if(!s.hint.order&&!sub){s.hint.order=1;setTimeout(()=>toast('오른쪽 위 주문 목록(또는 P)을 눌러 포스기에서 주문을 승인하세요','info'),900)}return o}
function approve(o){if(o.status!=='new')return;o.status='accepted';o.due=s.min+150;A.play('approve');emit('star',CAFE.doorPt.x,CAFE.doorPt.y,30,10,{c:'#9be07a'});
 if(!s.hint.brew){s.hint.brew=1;toast('달빛 커피 카운터(초록 표시) 앞에서 E를 눌러 메뉴를 만드세요','info')}}
function reject(o){s.orders=s.orders.filter(x=>x!==o);addPop(-1);A.play('reject');toast(`주문 거절 · ${o.who} (인기 -1)`,'bad')}
const carrying=()=>s.orders.filter(o=>o.status==='ready').length;

/* ---------------- INTERACTION ---------------- */
function nearInteract(){const P=s.p;let best=null;const near=(x,y,r,o)=>{const d=Math.hypot(P.x-x,P.y-y);if(d<r&&(!best||d<best.d))best={...o,d}};
 const toBrew=s.orders.filter(o=>o.status==='accepted').length;
 near(CAFE.doorPt.x,CAFE.doorPt.y,1.4,{k:'cafe',label:toBrew&&carrying()<4?`메뉴 만들기 (${toBrew})`:'포스기 보기'});
 for(const b of CUSTOMERS){const n=s.orders.filter(o=>o.status==='ready'&&o.site===b.id).length;if(n)near(b.doorPt.x,b.doorPt.y,1.4,{k:'deliver',b,label:`배달하기 (${n}잔)`})}
 for(const bn of BENCHES)near(bn.x+bn.w/2,bn.y+bn.d/2,1.15,{k:'bench',bn,label:(s.benchCd[bn.i]||0)>s.min?'벤치 (잠시 후 다시)':'벤치에서 쉬기 (+5)'});
 near(HOME.doorPt.x,HOME.doorPt.y,1.4,{k:'home',label:s.closed?'집에서 쉬기 (하루 마무리)':'집 (영업 종료 후 쉬기)'});
 for(const n of s.npcs)near(n.x,n.y,1.2,{k:'npc',n,label:n.promo>0?'판촉하기!':'인사하기'});
 return best}
function interact(){const P=s.p;if(P.sit>0)return;const t=nearInteract();
 if(!t){emit('px',P.x,P.y,4,5,{c:'#d8c8a8'});A.play('click');toast('가까이에 상호작용할 곳이 없어요','info');return}
 if(t.k==='cafe'){const next=s.orders.find(o=>o.status==='accepted');if(next&&carrying()<4)openBrew();else{if(next)toast('한 번에 4잔까지만 들 수 있어요. 먼저 배달하세요!','bad');openPOS('orders')}}
 else if(t.k==='deliver')deliver(t.b);
 else if(t.k==='bench'){const bn=t.bn;if((s.benchCd[bn.i]||0)>s.min){A.play('click');emit('px',P.x,P.y,10,4,{c:'#ccc'});toast('방금 쉬었던 벤치예요. 잠시 후 다시 쉴 수 있어요','info');return}

 for(const bd of BUILDINGS){const [x,y]=S(bd.x+bd.w/2,bd.y+bd.d/2,bd.h+(bd.roof==='gable'?14:bd.roof==='clock'?36:bd.roof==='cafe'?12:2));if(x<-60||x>CW+60||y<-20||y>CH+40)continue;
  const k=bd.kind,big=k==='mycafe'||k==='rival'||k==='home';label(x,y-4,k==='mycafe'?'★ 달빛 커피 (내 카페)':k==='rival'?'경쟁 · '+bd.name:k==='home'?'🏠 내 집':bd.name,k==='mycafe'?'#3f8f4f':k==='rival'?'#b2453c':k==='home'?'#3c6fb2':'rgba(59,42,32,.82)','#fff',big?12:10)}
 if(s.status==='ready'||s.status==='intro')return;
 const bounce=Math.abs(Math.sin(s.t*4))*6;
 for(const t of targets()){const [gx,gy]=S(t.x,t.y,0),[x,y0]=S(t.x,t.y,t.z+18),y=Math.max(y0,40);if(gx>20&&gx<CW-20&&gy>30&&gy<CH-10){label(x,y-bounce,'▼ '+t.label,t.c,'#3b2a20',12)}
  else if(!t.noArrow){const cx=CW/2,cy=CH/2,dx=gx-cx,dy=gy-cy,k=Math.min((CW/2-34)/Math.abs(dx||1),(CH/2-34)/Math.abs(dy||1)),ax=cx+dx*k,ay=cy+dy*k,an=Math.atan2(dy,dx);
   ctx.save();ctx.translate(ax,ay);ctx.rotate(an);ctx.fillStyle=t.c;ctx.strokeStyle='#3b2a20';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-8,-11);ctx.lineTo(-3,0);ctx.lineTo(-8,11);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();label(ax-Math.cos(an)*24,ay-Math.sin(an)*24+6,t.label,t.c,'#3b2a20',10)}}
 for(const n of s.npcs){const [x,y]=S(n.x,n.y,22);if(n.promo>0&&!s.modal)label(x,y-bounce,'! 판촉 찬스','#ff8a3a','#fff',11);if(n.say)label(x,y-34,n.say.text,'#fff','#3b2a20',11)}
 for(const f of s.floats){const [x,y]=S(f.x,f.y,f.z);ctx.globalAlpha=clamp(1.4-f.life,0,1);ctx.font='900 16px "Noto Sans KR",sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#3b2a20';ctx.strokeText(f.text,x,y);ctx.fillStyle=f.c;ctx.fillText(f.text,x,y);ctx.globalAlpha=1}
 if(s.status==='playing'&&!s.modal&&s.p.sit<=0){const t=nearInteract();if(t){const [x,y]=S(s.p.x,s.p.y,26);label(x,y,'E  '+t.label,'#fff8e0','#3b2a20',12)}}
 if(s.p.sit>0){const [x,y]=S(s.p.x,s.p.y,30);ctx.fillStyle='#3b2a20';ctx.fillRect(x-22,y,44,6);ctx.fillStyle='#9be07a';ctx.fillRect(x-21,y+1,42*(1-s.p.sit/1.6),4)}}
function drawMini(){const g=mini.getContext('2d');g.clearRect(0,0,240,120);g.drawImage(miniBase,0,0);const M2=(x,y)=>[120+(x-y)*4,(x+y)*2],bl=Math.sin(s.t*8)>0;
 if(s.status==='playing'||s.status==='paused')for(const t of targets()){const [x,y]=M2(t.x,t.y);if(bl){g.fillStyle=t.c;g.fillRect(x-3,y-3,6,6)}}
 for(const n of s.npcs){const [x,y]=M2(n.x,n.y);g.fillStyle=n.promo>0?(bl?'#ff8a3a':'#fff'):'rgba(255,255,255,.6)';g.fillRect(x-1,y-1,n.promo>0?3:2,n.promo>0?3:2)}
 for(const bn of BENCHES){const [x,y]=M2(bn.x+bn.w/2,bn.y+bn.d/2);g.fillStyle='#b07440';g.fillRect(x-1,y-1,3,2)}
 if(s.status!=='ready'&&s.status!=='intro'){const [x,y]=M2(s.p.x,s.p.y);g.fillStyle='#3b2a20';g.fillRect(x-3,y-3,7,7);g.fillStyle='#fff';g.fillRect(x-2,y-2,5,5)}}
function drawBrew(m,dt){const c=$('#brewCv');if(!c)return;const g=c.getContext('2d'),mn=MENU[m.o.m];g.fillStyle='#3a2c3c';g.fillRect(0,0,75,60);g.fillStyle='#5a4a3a';g.fillRect(0,48,75,12);
 const ice=m.o.temp==='ice',lvl=clamp(m.res>0?.85:m.g/100,0,1);
 g.fillStyle=ice?'rgba(220,240,255,.35)':'#fff8ee';g.fillRect(24,18,26,30);g.fillStyle='#3b2a20';g.fillRect(23,17,1,32);g.fillRect(50,17,1,32);g.fillRect(23,48,28,1);if(!ice){g.fillStyle='#fff8ee';g.fillRect(51,24,5,2);g.fillRect(55,24,2,12);g.fillRect(51,34,5,2)}
 const fh=Math.round(28*Math.min(1,lvl/.9));g.fillStyle=mn.color;g.fillRect(25,48-fh,24,fh);if(!ice&&fh>4){g.fillStyle='#fff2dc';g.fillRect(25,48-fh,24,2)}
 if(m.hold&&Math.random()<.6)m.parts.push(ice?{x:rand(27,44),y:10,vy:0,k:'i',l:0}:{x:rand(28,46),y:46-fh,vy:-rand(10,22),k:'s',l:0});
 for(const p of m.parts){p.l+=dt;if(p.k==='i'){p.vy+=160*dt;p.y+=p.vy*dt;const floor=48-fh-4;if(p.y>floor){p.y=floor;p.vy*=-.4}}else{p.y+=p.vy*dt;p.x+=Math.sin(p.l*6)*.3}}
 m.parts=m.parts.filter(p=>p.l<(p.k==='i'?2.5:1.2)).slice(-30);
 for(const p of m.parts){if(p.k==='i'){g.fillStyle='#d8f6ff';g.fillRect(Math.round(p.x),Math.round(p.y),4,4);g.fillStyle='#fff';g.fillRect(Math.round(p.x),Math.round(p.y),1,1)}else{g.fillStyle=`rgba(255,255,255,${.7-p.l/1.4})`;const r=2+p.l*3;g.fillRect(Math.round(p.x-r/2),Math.round(p.y-r/2),Math.ceil(r),Math.ceil(r))}}
 if(m.res>0){g.fillStyle='#ffe066';for(let i=0;i<6;i++){const a=s.t*4+i;g.fillRect(37+Math.round(Math.cos(a)*22),30+Math.round(Math.sin(a)*18),2,2)}}}
let hudT=0,shownGold=100;
function hud(dt){hudT-=dt;if(hudT>0)return;hudT=.1;
 $('#enNum').textContent=`${Math.round(s.energy)} / 100`;$('#enFill').style.width=s.energy+'%';$('#enBar').classList.toggle('tired',s.energy<=20);
 $('#cond').textContent=s.energy<=0?'기진맥진… (속도 40%)':s.energy<=20?'😓 피곤 상태 (속도 60%)':s.p.sit>0?'벤치에서 쉬는 중…':'컨디션 좋음';
 $('#clock').textContent=`${dateTxt()} ${fmt(s.min)}`;const sh=$('#shop');sh.textContent=isOpen()?`영업 중 (~${s.hours.close}시)`:s.closed?'영업 종료 · 집에서 쉬기':`영업 준비 중 (${s.hours.open}시 오픈)`;sh.className='badge '+(isOpen()?'open':s.closed?'closed':'');
 shownGold+=(s.gold-shownGold)*.35;if(Math.abs(s.gold-shownGold)<1)shownGold=s.gold;$('#gold').textContent=`${Math.round(shownGold)} G`;$('#pop').textContent=`★ ${Math.round(s.pop)}`;$('#rankTxt').textContent=`타운 카페 랭킹 ${myRank()}위 / 5`;
 const list=s.orders.slice(0,3),more=s.orders.length-list.length;
 $('#questBtn').innerHTML=`<h4><span>📋 주문 퀘스트 ${s.orders.length}</span><span>포스기 ▶</span></h4>${list.length?`<ol>${list.map(o=>`<li><b class="st-${o.status}">${o.status==='new'?'승인 대기':o.status==='accepted'?'제조 대기':'배달 중'}</b>${esc(tempName(o))} · ${esc(BY[o.site].name)}</li>`).join('')}</ol>${more>0?`<div class="empty">외 ${more}건 더…</div>`:''}`:`<div class="empty">${isOpen()?'주문을 기다리는 중…':s.closed?'오늘 영업 끝!':'오픈 전이에요'}</div>`}<div class="empty">데일리 ${s.quests.filter(q=>q.done).length}/3 · 정기 고객 ${s.subs.length}</div>`;
 drawMini()}
let last=0;function loop(ms){const dt=last?Math.min(.05,(ms-last)/1000):0;last=ms;try{if(s.status!=='paused')update(dt);render();hud(dt)}catch(err){console.error(err)}requestAnimationFrame(loop)}
s=newGame();s.npcs=makeNPCs();{const c=iso(15,15);cam.x=c[0];cam.y=c[1]}showTitle();resize();requestAnimationFrame(loop);
window.CoffeeTown={get state(){return s},tick(sec,dt=1/30){for(let t=0;t<sec;t+=dt)update(dt)},spawnOrder,approve,openPOS,interact,press,release,goSleep,BUILDINGS,BENCHES,TREES,blocked};
})();
